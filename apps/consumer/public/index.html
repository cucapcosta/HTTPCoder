<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTTPCoder Consumer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a2f3a;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --accent: #4f8cff;
        --ok: #3fb96b;
        --bad: #e5534b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 { font-size: 15px; margin: 0; }
      #status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      #status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
      #status.connected .dot { background: var(--ok); }
      #fingerprint { font-size: 11px; color: var(--muted); font-family: monospace; }
      select {
        margin-left: auto;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 8px;
      }
      #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 80%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
      .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
      .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
      .msg.tool { align-self: flex-start; background: transparent; border: 1px dashed var(--border); color: var(--muted); font-family: monospace; font-size: 12px; }
      .perm {
        align-self: stretch;
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--panel);
        padding: 12px;
      }
      .perm h3 { margin: 0 0 6px; font-size: 14px; }
      .perm .target { font-family: monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
      .perm .diff { display: flex; gap: 8px; margin: 8px 0; }
      .perm .diff pre {
        flex: 1;
        margin: 0;
        padding: 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 11px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .perm .actions { display: flex; gap: 8px; margin-top: 8px; }
      .perm button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; background: var(--bg); color: var(--text); }
      .perm button.once { background: var(--accent); border-color: var(--accent); color: #fff; }
      .perm button.deny { color: var(--bad); }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
      form input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      form button { padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
      form button:disabled { opacity: 0.5; cursor: default; }
      #banner { padding: 8px 16px; background: #4a2c2a; color: #ffb4ab; font-size: 13px; display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
